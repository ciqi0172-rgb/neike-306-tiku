name: Deploy restored green mind-map question bank

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Check out original green question bank
        uses: actions/checkout@v4
        with:
          repository: ciqi0172-rgb/neike-306-tiku-web
          ref: main
          path: green-source

      - name: Prepare static site
        run: |
          mkdir -p dist-pages
          cp green-source/index.html dist-pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
