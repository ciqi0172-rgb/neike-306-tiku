<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>306 思维导图题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c7a49'/%3E%3Cpath d='M8 24V7h14v17H8zm3-14v11h8V10h-8z' fill='%23f1f7f3'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1f2d26; --muted:#6b7f74; --line:#dfeae3; --soft:#f1f7f3;
  --blue:#2e9e63; --blue-deep:#1c7a49; --blue-soft:#e7f4ec;
  --green:#1e8e5a; --green-soft:#e6f6ed;
  --coral:#d95950; --coral-soft:#fff1ef;
  --amber-soft:#fff8e6; --amber:#b7791f;
  --shadow:0 18px 40px rgba(31,80,52,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:linear-gradient(180deg,#fafdfb 0,#f3faf5 100%);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c3d6ca;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(30,142,90,.28)}
.brand-copy strong{display:block;font-size:15px;line-height:1.25;white-space:nowrap}
.brand-copy span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.subject-switch{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.subject-switch button{padding:6px 14px;border-radius:9px;font-size:13.5px;color:var(--muted);transition:.15s;white-space:nowrap}
.subject-switch button:hover{color:var(--ink)}
.subject-switch button.active{background:#fff;color:var(--blue-deep);font-weight:600;box-shadow:0 2px 8px rgba(31,80,52,.12)}
.progress-strip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.progress-strip strong{color:var(--ink);font-size:13px}
.progress-bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-deep));border-radius:3px;transition:width .25s}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.search-box{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 11px;width:230px}
.search-box svg{flex:none;color:var(--muted)}
.search-box input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:13.5px}
.search-box kbd{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
.search-box .clear{color:var(--muted);font-size:15px;padding:0 2px}
.filter-box{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.filter-box svg{color:var(--muted);flex:none}
.filter-box select{border:none;background:none;outline:none;font-size:13px;color:var(--ink);appearance:none;cursor:pointer}

/* ===== 工作区 ===== */
.workspace{display:grid;grid-template-columns:258px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:20px 22px 60px;align-items:start}
.workspace.sidebar-collapsed{grid-template-columns:1fr}
.workspace.sidebar-collapsed .sidebar{display:none}

/* ===== 侧栏 ===== */
.sidebar{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 10px;position:sticky;top:78px;max-height:calc(100vh - 100px);overflow-y:auto}
.sidebar-heading{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.sidebar-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.sidebar-toggle{color:var(--muted);padding:4px;border-radius:7px}
.sidebar-toggle:hover{background:var(--soft);color:var(--ink)}
.fav-link{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;font-size:14px;text-align:left}
.fav-link:hover{background:var(--soft)}
.fav-link.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
.fav-link em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:0 8px}
.fav-link.active em{background:#fff;color:var(--blue-deep)}
.nav-label{font-size:11.5px;color:var(--muted);padding:10px 10px 5px;letter-spacing:.05em}
.topic-link{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:10px;font-size:14px;text-align:left;color:var(--ink)}
.topic-link:hover{background:var(--soft)}
.topic-link.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
.topic-link em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.topic-link .caret{transition:.15s;color:var(--muted);flex:none}
.topic-link .caret.open{transform:rotate(90deg)}
.lecture-link{display:flex;align-items:center;width:100%;padding:5px 10px 5px 34px;border-radius:9px;font-size:13px;color:var(--muted);text-align:left}
.lecture-link:hover{background:var(--soft);color:var(--ink)}
.lecture-link.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
.lecture-link em{margin-left:auto;font-style:normal;font-size:11.5px}
.sidebar-stats{margin:12px 8px 2px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.9}

/* ===== 主区题卡 ===== */
.main{min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:20px 26px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.card-head h1{font-size:18px;line-height:1.45;flex:1;min-width:0}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.blue{background:var(--blue-soft);color:var(--blue-deep);border-color:transparent}
.fav-btn{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.fav-btn:hover{background:var(--soft)}
.fav-btn.active{color:#e8a13a}
.shared-box{margin:18px 26px 0;background:var(--blue-soft);border:1px solid #d0e8d9;border-radius:14px;padding:14px 18px}
.shared-box .shared-title{font-size:12.5px;font-weight:700;color:var(--blue-deep);margin-bottom:6px;letter-spacing:.05em}
.shared-box ul{list-style:none}
.shared-box li{display:flex;gap:9px;font-size:16px;padding:3px 0;line-height:1.55}
.shared-box .okey{font-weight:700;color:var(--blue-deep);flex:none;min-width:18px}
.stem-list{padding:6px 26px 4px}
.stem{padding:16px 0;border-bottom:1px dashed var(--line);border-left:3px solid transparent;padding-left:12px;margin-left:-12px}
.stem:last-child{border-bottom:none}
.stem.active-stem{border-left-color:var(--blue);background:linear-gradient(90deg,var(--blue-soft),transparent 60%)}
.stem-q{display:flex;gap:10px;align-items:flex-start}
.stem-no{flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px}
.stem-text{flex:1;font-size:16px;min-width:0}
.mode-tag{flex:none;font-size:11px;padding:1px 8px;border-radius:12px;margin-top:2px}
.mode-tag.single{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.mode-tag.multi{background:#f3ecff;color:#6b46c1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:11px 0 0 34px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:13.5px;transition:.13s;user-select:none}
.chip .ckey{font-weight:700;color:var(--muted)}
.chip:hover:not(:disabled){border-color:var(--blue);color:var(--blue-deep)}
.chip:hover:not(:disabled) .ckey{color:var(--blue)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}
.chip.on .ckey{color:var(--blue)}
.chip:disabled{cursor:default}
.chip.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.chip.right .ckey{color:var(--green)}
.chip.wrong{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.chip.wrong .ckey{color:var(--coral)}
.chip.miss{border-color:var(--green);border-style:dashed;color:var(--green);background:#fff}
.chip.miss .ckey{color:var(--green)}
.stem-result{margin:10px 0 0 34px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.verdict{font-weight:700;font-size:13px}
.verdict.ok{color:var(--green)}
.verdict.bad{color:var(--coral)}
.answer-line{color:var(--muted)}
.answer-line b{color:var(--ink)}
.mnemonic{width:100%;background:var(--amber-soft);border:1px solid #f2e3b6;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--amber);line-height:1.6}
.mnemonic b{margin-right:4px}
.card-foot{display:flex;align-items:center;gap:12px;padding:16px 26px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.primary-btn{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;font-size:14px;font-weight:600;
  padding:9px 26px;border-radius:11px;box-shadow:0 4px 14px rgba(30,142,90,.3);transition:.15s}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,142,90,.36)}
.primary-btn:disabled{opacity:.45;transform:none;box-shadow:none;cursor:not-allowed}
.ghost-btn{border:1.5px solid var(--line);color:var(--muted);font-size:13.5px;padding:8px 18px;border-radius:11px;transition:.15s;background:#fff}
.ghost-btn:hover{border-color:var(--blue);color:var(--blue-deep)}
.foot-hint{font-size:12px;color:var(--muted);margin-left:auto}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.pager-mid{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pager-mid input{width:64px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13px;outline:none;background:#fff}
.pager-mid input:focus{border-color:var(--blue)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:70px 30px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

.backdrop{display:none}
@media (max-width:920px){
  .workspace{grid-template-columns:1fr;padding:14px 12px 50px}
  .workspace.sidebar-collapsed .sidebar{display:block}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:284px;max-height:none;margin:0;z-index:120;
    border-radius:0 16px 16px 0;transform:translateX(-105%);transition:transform .22s ease;
    overflow-y:auto;box-shadow:0 0 40px rgba(31,80,52,.18)}
  .workspace.drawer-open .sidebar{transform:none}
  .workspace.drawer-open .backdrop{display:block;position:fixed;inset:0;z-index:110;background:rgba(20,40,30,.35)}
  .topbar{gap:10px;padding:10px 12px}
  .search-box{width:150px}
  .progress-strip{display:none}
  .brand-copy span{display:none}
  .card-head h1{font-size:16px}
  .chips{margin-left:0}
  .stem-result{margin-left:0}
  .chip{min-width:44px;min-height:44px;justify-content:center}
  .subject-switch button,.primary-btn,.ghost-btn,.topic-link,.fav-link{min-height:44px}
}
</style>

var LZString = (function() {

      buf[i*2+1] = current_value % 256;

  },

  //decompress from uint8array (UCS-2 big endian format)

<script>
(function(){
'use strict';
var GROUPS = window.BANK.groups;
var SUBJECTS = window.BANK.subjects;
var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function load(k, d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var state = {
  subject: SUBJECTS.indexOf(load('mm-subject','内科'))>=0 ? load('mm-subject','内科') : '内科',
  topic: '', lecture: '', search: '', type: '全部',
  favOnly: false, index: 0, activeStem: 0,
  sidebarCollapsed: window.innerWidth <= 920
};
var selections = load('mm-selections-v2', {});
var submitted  = load('mm-submitted-v2', {});
var favorites  = load('mm-favorites-v2', []);

var bySubject = {};
SUBJECTS.forEach(function(s){ bySubject[s] = []; });
GROUPS.forEach(function(g){ if(bySubject[g.subject]) bySubject[g.subject].push(g); });

function chapterTree(){
  var topics = [], tmap = {};
  bySubject[state.subject].forEach(function(g){
    var t = g.topic || '未分类', l = g.lecture || '';
    if(!tmap[t]){ tmap[t] = {name:t, count:0, stems:0, lectures:{}}; topics.push(tmap[t]); }
    var T = tmap[t]; T.count++; T.stems += g.stems.length;
    if(l){ if(!T.lectures[l]) T.lectures[l] = {name:l, count:0}; T.lectures[l].count++; }
  });
  topics.forEach(function(T){
    T.lecList = Object.keys(T.lectures).map(function(k){ return T.lectures[k]; });
  });
  return topics;
}

function filtered(){
  var q = state.search.trim().toLowerCase();
  return bySubject[state.subject].filter(function(g){
    if(state.favOnly && favorites.indexOf(g.id)<0) return false;
    if(state.topic && g.topic !== state.topic) return false;
    if(state.lecture && (g.lecture||'') !== state.lecture) return false;
    if(state.type !== '全部'){
      var want = state.type;
      if(!g.stems.some(function(s){ return s.answerMode === want; })) return false;
    }
    if(q){
      var hay = (g.title+' '+g.topic+' '+(g.lecture||'')+' '+
        g.options.map(function(o){return o.label;}).join(' ')+' '+
        g.stems.map(function(s){return s.text+' '+(s.mnemonic||'');}).join(' ')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

var list = filtered();
function cur(){ return list[Math.min(state.index, list.length-1)] || null; }
function clampIndex(){ if(state.index >= list.length) state.index = Math.max(0, list.length-1); if(state.index<0) state.index=0; }
function isSubmitted(g){ return !!submitted[g.id]; }
function getSel(g, i){ return selections[g.id] && selections[g.id][i] || []; }
function setSel(g, i, arr){
  if(!selections[g.id]) selections[g.id] = {};
  selections[g.id][i] = arr;
  save('mm-selections-v2', selections);
}
function sameSet(a, b){
  if(a.length !== b.length) return false;
  var s = {}; a.forEach(function(x){ s[x]=1; });
  return b.every(function(x){ return s[x]; });
}
function stemCorrect(g, i){ return sameSet(getSel(g,i), g.stems[i].answer); }
function groupStats(gs){
  var done=0, right=0, tot=0;
  gs.forEach(function(g){
    if(!submitted[g.id]) return;
    done++;
    g.stems.forEach(function(s,i){ tot++; if(stemCorrect(g,i)) right++; });
  });
  return {done:done, right:right, tot:tot};
}

/* ---------- 渲染 ---------- */
function iconSvg(name, size){
  size = size||20;
  var paths = {
    book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',
    search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm10 2-4.35-4.35',
    star:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z',
    starFill:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z',
    left:'M15 18l-6-6 6-6',
    right:'M9 18l6-6-6-6',
    chevron:'M9 18l6-6-6-6',
    sliders:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'
  };
  var fill = (name==='starFill');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+
    '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+paths[name]+'"/></svg>';
}

function render(){
  clampIndex();
  var g = cur();
  var gs = bySubject[state.subject];
  var st = groupStats(gs);
  var tree = chapterTree();
  var favCount = favorites.filter(function(id){ return gs.some(function(x){return x.id===id;}); }).length;

  var h = '';
  // 顶栏
  h += '<header class="topbar">';
  h += '<div class="brand"><div class="brand-mark">'+iconSvg('book',21)+'</div>'+
       '<div class="brand-copy"><strong>306 思维导图题库</strong><span>生理 · 生化 · 病理 · 内科 · 外科　共 '+window.BANK.totalGroups+' 组 / '+window.BANK.totalStems+' 题</span></div></div>';
  h += '<nav class="subject-switch" aria-label="选择科目">';
  SUBJECTS.forEach(function(s){
    h += '<button class="'+(state.subject===s?'active':'')+'" data-act="subject" data-v="'+s+'">'+s+'</button>';
  });
  h += '</nav>';
  var pct = list.length ? Math.round((state.index+1)/list.length*100) : 0;
  h += '<div class="progress-strip"><span>本轮进度</span><strong>'+(list.length?(state.index+1)+' / '+list.length+' 组':'暂无匹配')+'</strong>'+
       '<div class="progress-bar"><i style="width:'+(list.length?pct:0)+'%"></i></div><span>'+(list.length?pct:0)+'%</span></div>';
  h += '<div class="top-actions">';
  h += '<label class="search-box">'+iconSvg('search',16)+'<input id="searchInput" placeholder="搜索题目 / 关键词" value="'+esc(state.search)+'">'+
       (state.search?'<button class="clear" data-act="clearSearch" aria-label="清空">×</button>':'<kbd>⌘K</kbd>')+'</label>';
  h += '<label class="filter-box">'+iconSvg('sliders',15)+'<select id="typeFilter" aria-label="题型筛选">'+
       ['全部','单选','多选'].map(function(t){ return '<option'+(state.type===t?' selected':'')+'>'+t+'</option>'; }).join('')+'</select>'+iconSvg('chevron',13)+'</label>';
  h += '</div></header>';

  // 工作区
  h += '<div class="workspace'+(state.sidebarCollapsed?' sidebar-collapsed':' drawer-open')+'">';
  if(!state.sidebarCollapsed) h += '<div class="backdrop" data-act="closeSidebar"></div>';
  // 侧栏
  h += '<aside class="sidebar">';
  h += '<div class="sidebar-heading"><div class="sidebar-title">'+esc(state.subject)+'章节目录</div>'+
       '<button class="sidebar-toggle" data-act="toggleSidebar" aria-label="收起目录">'+iconSvg('left',16)+'</button></div>';
  h += '<button class="fav-link'+(state.favOnly?' active':'')+'" data-act="favOnly">'+iconSvg(state.favOnly?'starFill':'star',18)+'<span>收藏本</span><em>'+favCount+'</em></button>';
  h += '<div class="nav-label">章节 / 讲次（'+gs.length+' 组）</div>';
  h += '<button class="topic-link'+((!state.topic&&!state.favOnly)?' active':'')+'" data-act="topicAll"><span>全部章节</span><em>'+gs.length+'</em></button>';
  tree.forEach(function(T){
    var open = state.topic === T.name;
    h += '<button class="topic-link'+(open&&!state.lecture?' active':'')+'" data-act="topic" data-v="'+esc(T.name)+'">'+
         '<span class="caret'+(open?' open':'')+'">'+iconSvg('chevron',13)+'</span><span>'+esc(T.name)+'</span><em>'+T.count+'</em></button>';
    if(open){
      T.lecList.forEach(function(L){
        h += '<button class="lecture-link'+(state.lecture===L.name?' active':'')+'" data-act="lecture" data-t="'+esc(T.name)+'" data-v="'+esc(L.name)+'"><span>'+esc(L.name)+'</span><em>'+L.count+'</em></button>';
      });
    }
  });
  var acc = st.tot ? Math.round(st.right/st.tot*100) : 0;
  h += '<div class="sidebar-stats">本科目 '+gs.length+' 组 · '+gs.reduce(function(a,g){return a+g.stems.length;},0)+' 题<br>已做 '+st.done+' 组'+(st.tot?' · 正确率 '+acc+'% ('+st.right+'/'+st.tot+')':'')+'</div>';
  h += '</aside>';

  // 主区
  h += '<main class="main">';
  if(!g){
    h += '<div class="empty"><strong>没有匹配的题组</strong>试试清空搜索词、切换题型筛选或章节。</div>';
  } else {
    h += renderCard(g);
  }
  h += '</main></div>';
  $('#app').innerHTML = h;
  bindEvents();
}

function renderCard(g){
  var sub = isSubmitted(g);
  var h = '<div class="card">';
  var isFav = favorites.indexOf(g.id) >= 0;
  h += '<div class="card-head"><h1>'+esc(g.title)+'</h1>'+
       '<button class="fav-btn'+(isFav?' active':'')+'" data-act="fav" aria-label="收藏" title="收藏本组">'+iconSvg(isFav?'starFill':'star',19)+'</button></div>';
  // 标签行并入标题下方
  h = h.replace('</h1>', '</h1>') ;
  var tags = '<div class="card-tags"><span class="tag blue">'+esc(g.kindLabel||'B型题')+'</span><span class="tag">'+esc(g.topic)+'</span>'+
      (g.lecture?'<span class="tag">'+esc(g.lecture)+'</span>':'')+'<span class="tag">'+g.stems.length+' 题</span></div>';
  h = h.replace('</h1>\n', '</h1>'); // noop safeguard
  h = h.replace('</h1>', '</h1><div></div>');
  // 简化：直接重建 card-head
  h = '<div class="card"><div class="card-head"><div style="flex:1;min-width:0"><h1>'+esc(g.title)+'</h1>'+tags+'</div>'+
      '<button class="fav-btn'+(isFav?' active':'')+'" data-act="fav" aria-label="收藏" title="收藏本组">'+iconSvg(isFav?'starFill':'star',19)+'</button></div>';

  // 共用选项
  h += '<div class="shared-box"><div class="shared-title">共用选项（'+g.options.length+' 个）</div><ul>';
  g.options.forEach(function(o){ h += '<li><span class="okey">'+esc(o.key)+'.</span><span>'+esc(o.label)+'</span></li>'; });
  h += '</ul></div>';

  // 题干
  h += '<div class="stem-list">';
  g.stems.forEach(function(s, i){
    var sel = getSel(g, i);
    var activeCls = (!sub && i===state.activeStem) ? ' active-stem' : '';
    h += '<div class="stem'+activeCls+'" data-stem="'+i+'">';
    h += '<div class="stem-q"><span class="stem-no">'+s.number+'</span><span class="stem-text">'+esc(s.text)+'</span>'+
         '<span class="mode-tag '+(s.answerMode==='多选'?'multi':'single')+'">'+s.answerMode+'</span></div>';
    h += '<div class="chips">';
    g.options.forEach(function(o){
      var cls = 'chip', dis = '';
      var picked = sel.indexOf(o.key) >= 0;
      if(sub){
        dis = ' disabled';
        var inAns = s.answer.indexOf(o.key) >= 0;
        if(picked && inAns) cls += ' right';
        else if(picked && !inAns) cls += ' wrong';
        else if(inAns) cls += ' miss';
      } else if(picked){ cls += ' on'; }
      h += '<button class="'+cls+'" data-act="pick" data-stem="'+i+'" data-key="'+esc(o.key)+'"'+dis+'><span class="ckey">'+esc(o.key)+'</span></button>';
    });
    h += '</div>';
    if(sub){
      var ok = stemCorrect(g, i);
      h += '<div class="stem-result"><span class="verdict '+(ok?'ok':'bad')+'">'+(ok?'✓ 正确':'✗ 错误')+'</span>'+
           '<span class="answer-line">答案：<b>'+s.answer.join('、')+'</b>'+(sel.length?'　你的选择：'+(sel.join('、')||'（未答）'):'　你未作答')+'</span>';
      if(s.mnemonic) h += '<div class="mnemonic"><b>💡 口诀</b>'+esc(s.mnemonic)+'</div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';

  // 底部
  h += '<div class="card-foot">';
  if(!sub){
    var answered = g.stems.filter(function(s,i){ return getSel(g,i).length>0; }).length;
    h += '<button class="primary-btn" data-act="submit">提交答案（'+answered+'/'+g.stems.length+'）</button>';
    h += '<button class="ghost-btn" data-act="clearSel">清空选择</button>';
    h += '<span class="foot-hint">快捷键：字母选选项 · ↑↓ 换题 · ←→ 翻组 · Enter 提交</span>';
  } else {
    var rightN = g.stems.filter(function(s,i){ return stemCorrect(g,i); }).length;
    h += '<button class="primary-btn" data-act="next">下一组 →</button>';
    h += '<button class="ghost-btn" data-act="redo">重做本组</button>';
    h += '<span class="foot-hint">本组答对 '+rightN+'/'+g.stems.length+' 题</span>';
  }
  h += '</div></div>';

  // 翻页
  h += '<div class="pager"><button class="ghost-btn" data-act="prev">← 上一组</button>'+
       '<div class="pager-mid">第 <input id="jumpInput" value="'+(state.index+1)+'" aria-label="跳转到"> / '+list.length+' 组</div>'+
       '<button class="ghost-btn" data-act="next">下一组 →</button></div>';
  return h;
}

/* ---------- 事件 ---------- */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click', onAction);
  });
  var si = $('#searchInput');
  if(si) si.addEventListener('input', function(){
    state.search = si.value; state.index = 0; refreshList();
  });
  var tf = $('#typeFilter');
  if(tf) tf.addEventListener('change', function(){
    state.type = tf.value; state.index = 0; refreshList();
  });
  var ji = $('#jumpInput');
  if(ji) ji.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var n = parseInt(ji.value,10);
      if(n>=1 && n<=list.length){ state.index = n-1; state.activeStem=0; render(); }
      else ji.value = state.index+1;
    }
  });
  var card = $('.card');
  if(card) card.scrollIntoView && state.keepScroll!==true;
}

function refreshList(){ list = filtered(); render(); }
function autoCloseDrawer(){ if(window.innerWidth<=920) state.sidebarCollapsed = true; }

function onAction(e){
  var el = e.currentTarget, act = el.dataset.act;
  var g = cur();
  switch(act){
    case 'subject':
      state.subject = el.dataset.v; save('mm-subject', state.subject);
      state.topic=''; state.lecture=''; state.favOnly=false; state.index=0; state.activeStem=0;
      refreshList(); break;
    case 'topicAll': state.topic=''; state.lecture=''; state.favOnly=false; state.index=0; state.activeStem=0; autoCloseDrawer(); refreshList(); break;
    case 'topic':
      if(state.topic === el.dataset.v && !state.lecture){ state.topic=''; }
      else { state.topic = el.dataset.v; state.lecture=''; }
      state.favOnly=false; state.index=0; state.activeStem=0;
      if(state.topic) autoCloseDrawer();
      refreshList(); break;
    case 'lecture':
      state.topic = el.dataset.t; state.lecture = el.dataset.v; state.favOnly=false; state.index=0; state.activeStem=0; autoCloseDrawer(); refreshList(); break;
    case 'favOnly': state.favOnly = !state.favOnly; state.index=0; state.activeStem=0; autoCloseDrawer(); refreshList(); break;
    case 'toggleSidebar': case 'closeSidebar': state.sidebarCollapsed = true; render(); break;
    case 'clearSearch': state.search=''; state.index=0; refreshList(); break;
    case 'fav':
      if(!g) break;
      var p = favorites.indexOf(g.id);
      if(p>=0) favorites.splice(p,1); else favorites.push(g.id);
      save('mm-favorites-v2', favorites); render(); break;
    case 'pick':
      if(!g || isSubmitted(g)) break;
      var i = +el.dataset.stem, key = el.dataset.key;
      state.activeStem = i;
      var stem = g.stems[i], sel = getSel(g,i).slice();
      var at = sel.indexOf(key);
      if(at>=0){ sel.splice(at,1); }
      else if(stem.answerMode==='多选'){ sel.push(key); sel.sort(); }
      else { sel = [key]; }
      setSel(g,i,sel); render(); break;
    case 'submit':
      if(!g) break;
      submitted[g.id] = true; save('mm-submitted-v2', submitted); render(); break;
    case 'redo':
      if(!g) break;
      delete submitted[g.id]; delete selections[g.id];
      save('mm-submitted-v2', submitted); save('mm-selections-v2', selections);
      state.activeStem=0; render(); break;
    case 'clearSel':
      if(!g) break;
      delete selections[g.id]; save('mm-selections-v2', selections); render(); break;
    case 'prev': if(state.index>0){ state.index--; state.activeStem=0; render(); window.scrollTo({top:0}); } break;
    case 'next': if(state.index<list.length-1){ state.index++; state.activeStem=0; render(); window.scrollTo({top:0}); } break;
  }
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', function(e){
  var t = e.target;
  var editable = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT');
  if((e.metaKey||e.ctrlKey) && !e.altKey && e.key.toLowerCase()==='k'){
    e.preventDefault();
    var si = $('#searchInput'); if(si){ si.focus(); si.select(); }
    return;
  }
  if(editable) return;
  var g = cur(); if(!g) return;
  var sub = isSubmitted(g);
  if(e.key==='ArrowLeft'){ e.preventDefault(); if(state.index>0){ state.index--; state.activeStem=0; render(); window.scrollTo({top:0}); } }
  else if(e.key==='ArrowRight'){ e.preventDefault(); if(state.index<list.length-1){ state.index++; state.activeStem=0; render(); window.scrollTo({top:0}); } }
  else if(e.key==='ArrowUp' || e.key==='ArrowDown'){
    e.preventDefault();
    if(!sub){
      state.activeStem = Math.min(Math.max(state.activeStem + (e.key==='ArrowDown'?1:-1), 0), g.stems.length-1);
      render();
      var row = $('.stem[data-stem="'+state.activeStem+'"]');
      if(row) row.scrollIntoView({block:'nearest'});
    }
  }
  else if(e.key==='Enter'){
    e.preventDefault();
    if(!sub){ submitted[g.id]=true; save('mm-submitted-v2',submitted); render(); }
    else if(state.index<list.length-1){ state.index++; state.activeStem=0; render(); window.scrollTo({top:0}); }
  }
  else if(!sub && /^[a-zA-Z]$/.test(e.key)){
    var key = e.key.toUpperCase();
    var keys = g.options.map(function(o){ return o.key; });
    if(keys.indexOf(key)>=0 && state.activeStem < g.stems.length){
      e.preventDefault();
      var i = state.activeStem, stem = g.stems[i], sel = getSel(g,i).slice();
      var at = sel.indexOf(key);
      if(at>=0) sel.splice(at,1);
      else if(stem.answerMode==='多选'){ sel.push(key); sel.sort(); }
      else sel=[key];
      setSel(g,i,sel); render();
    }
  }
});

/* 侧栏在窄屏默认收起时给一个展开入口 */
function ensureSidebarEntry(){
  if(!state.sidebarCollapsed) return;
  // 顶栏主题切换后补一个“目录”按钮
  var sw = $('.subject-switch');
  if(sw && !$('[data-act="openSidebar"]')){
    var b = document.createElement('button');
    b.textContent = '目录'; b.dataset.act = 'openSidebar';
    b.addEventListener('click', function(){ state.sidebarCollapsed=false; render(); });
    sw.parentNode.insertBefore(b, sw);
  }
}
var _render = render;
render = function(){ _render(); ensureSidebarEntry(); };

render();
})();

</script>
