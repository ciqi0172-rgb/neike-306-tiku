name: Deploy original green 306 mind-map question bank with 2024 exam mode

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment workflow
        uses: actions/checkout@v4

      - name: Check out verified green site source
        uses: actions/checkout@v4
        with:
          repository: ciqi0172-rgb/neike-306-tiku
          ref: mindmap-question-bank
          path: site-source
          fetch-depth: 1

      - name: Verify expected page markers
        run: |
          test -f site-source/docs/index.html
          grep -q '306 思维导图题库' site-source/docs/index.html
          grep -q 'window.BANK = JSON.parse(LZString.decompressFromBase64' site-source/docs/index.html
          test "$(wc -c < site-source/docs/index.html)" -gt 400000
          echo "Verified green 306 question bank source and embedded question bank."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-source/docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
